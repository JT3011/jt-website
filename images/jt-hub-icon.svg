<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">JT Performance Hub</title>
  <desc id="desc">Luxury black and gold JT monogram app icon.</desc>
  <defs>
    <radialGradient id="bg" cx="72%" cy="18%" r="92%">
      <stop offset="0" stop-color="#242015"/>
      <stop offset="0.48" stop-color="#090909"/>
      <stop offset="1" stop-color="#020202"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b2"/>
      <stop offset="0.35" stop-color="#d4af37"/>
      <stop offset="0.72" stop-color="#f5dc82"/>
      <stop offset="1" stop-color="#9f7617"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="88" fill="none" stroke="#d4af37" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="256" cy="235" r="154" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="256" cy="235" r="137" fill="none" stroke="#d4af37" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="256" cy="235" r="118" fill="#d4af37" fill-opacity="0.025"/>
  <path d="M132 91h248" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.88"/>
  <path d="M174 379h164" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.88"/>
  <text x="256" y="281" fill="url(#gold)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="154" font-weight="700" letter-spacing="-18" filter="url(#glow)">JT</text>
  <text x="256" y="430" fill="#f5e6b3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="6">PERFORMANCE</text>
  <text x="256" y="459" fill="#d4af37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="9">HUB</text>
