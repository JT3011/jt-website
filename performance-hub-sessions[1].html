<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Sessions · JT Performance Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root{--black:#050505;--panel:#0b0b0b;--gold:#d4af37;--gold2:#f5e6b3;--white:#f8f3e7;--muted:#aaa69b;--line:rgba(212,175,55,.16);--whiteLine:rgba(255,255,255,.075);--ok:#78d99a}
    *{box-sizing:border-box}html{background:var(--black)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,rgba(212,175,55,.12),transparent 32rem),var(--black);color:var(--white);font-family:Montserrat,sans-serif}a{color:inherit;text-decoration:none}.hidden{display:none!important}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(5,5,5,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topbar-inner{width:min(1180px,calc(100% - 32px));min-height:76px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:45px;height:45px;border-radius:13px}.brand strong{display:block;color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:1.4px}.brand span{display:block;margin-top:4px;color:var(--muted);font-size:.61rem;text-transform:uppercase}.back{padding:10px 14px;border:1px solid var(--whiteLine);border-radius:999px;font-size:.6rem;font-weight:900;text-transform:uppercase}
    .main{width:min(1180px,calc(100% - 32px));margin:auto;padding:44px 0 70px}.eyebrow{color:var(--gold);font-size:.62rem;font-weight:900;letter-spacing:1.8px;text-transform:uppercase}.hero{padding-bottom:30px;border-bottom:1px solid var(--line)}h1,h2,h3{font-family:"Playfair Display",serif}.hero h1{margin:9px 0 0;font-size:clamp(3.4rem,8vw,7.7rem);line-height:.82;letter-spacing:-.06em;text-transform:uppercase}.hero h1 span{color:var(--gold)}.hero p{max-width:720px;margin:20px 0 0;color:var(--muted);line-height:1.75}
    .player-select-wrap{margin-top:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.player-select-wrap label{font-size:.6rem;color:#c9c3b6;text-transform:uppercase;font-weight:800}.player-select{min-height:42px;padding:0 13px;border:1px solid var(--whiteLine);border-radius:999px;background:#0e0e0e;color:var(--white)}
    .timeline{display:grid;gap:16px;margin-top:28px}.session{padding:24px;border:1px solid var(--whiteLine);border-radius:25px;background:linear-gradient(120deg,rgba(212,175,55,.035),rgba(255,255,255,.01)),var(--panel)}.session-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.session-date{color:var(--gold2);font-size:.66rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.session h2{margin:7px 0 0;font-size:2.25rem;line-height:.93}.status{padding:7px 10px;border:1px solid var(--whiteLine);border-radius:999px;color:var(--muted);font-size:.55rem;font-weight:900;text-transform:uppercase}.status.completed{color:var(--ok);border-color:rgba(120,217,154,.2)}
    .meta{margin-top:8px;color:var(--muted);font-size:.7rem}.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.box{padding:16px;border:1px solid var(--whiteLine);border-radius:17px;background:#0d0d0d}.box strong{display:block;color:var(--gold);font-size:.57rem;letter-spacing:.9px;text-transform:uppercase}.box p{margin:8px 0 0;color:#d8d1c2;font-size:.78rem;line-height:1.65;white-space:pre-wrap}.box.full{grid-column:1/-1}.ratings{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.rating{padding:8px 10px;border:1px solid var(--whiteLine);border-radius:999px;color:#d7d0c0;font-size:.6rem}.rating b{color:var(--gold2)}
    .media{margin-top:19px;border-top:1px solid var(--whiteLine);padding-top:17px}.media h3{margin:5px 0 12px;font-size:1.5rem}.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.media-item{overflow:hidden;border:1px solid var(--whiteLine);border-radius:16px;background:#070707}.media-item video,.media-item img{width:100%;max-height:420px;display:block;object-fit:contain;background:#000}.media-caption{padding:9px 11px;color:var(--muted);font-size:.62rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .empty{margin-top:28px;padding:35px;border:1px dashed rgba(212,175,55,.2);border-radius:23px;color:var(--muted);text-align:center;line-height:1.75}
    @media(max-width:700px){.brand-copy{display:none}.main{width:min(100% - 24px,1180px);padding-top:30px}.content-grid,.media-grid{grid-template-columns:1fr}.box.full{grid-column:auto}.session{padding:18px}.session-head{flex-direction:column}.hero h1{font-size:clamp(3.5rem,18vw,5.6rem)}}
  </style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="/performance-hub-dashboard.html"><img src="images/logo.jpeg" alt="JT"><span class="brand-copy"><strong>JT Performance Hub</strong><span>Session Connect</span></span></a>
  <a class="back" href="/performance-hub-dashboard.html">← Dashboard</a>
</div></header>
<main class="main">
  <section class="hero">
    <div class="eyebrow">Your Development Record</div>
    <h1>My <span>Sessions.</span></h1>
    <p>Your coaching work stays connected between sessions. Review what you worked on, coach feedback, next actions and any clips uploaded for you.</p>
    <div class="player-select-wrap hidden" id="playerSelectorWrap"><label for="playerSelector">Viewing</label><select class="player-select" id="playerSelector"></select></div>
  </section>
  <div id="loading" class="empty">Loading your session history…</div>
  <section id="timeline" class="timeline hidden"></section>
</main>
<script type="module" src="/performance-hub-sessions.js"></script>
</body>
</html>
