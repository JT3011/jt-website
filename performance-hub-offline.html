<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Offline | JT Performance Hub</title>
  <meta name="description" content="JT Performance Hub offline screen.">

  <!-- JT Performance Hub PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050505">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JT Hub">
  <meta name="application-name" content="JT Performance Hub">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/applogo192.png?v=20260827.2">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/applogo192-192.png?v=20260827.2">
  <link rel="icon" type="image/png" sizes="512x512" href="/images/applogo192.png?v=20260827.2">
  <script defer src="/pwa-register.js?v=20260827.2"></script>

  <style>
    :root{color-scheme:dark;--black:#050505;--gold:#d4af37;--gold2:#f5e6b3;--white:#f8f3e7;--muted:#aaa59a}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));display:grid;place-items:center;background:radial-gradient(circle at 75% 10%,rgba(212,175,55,.18),transparent 28rem),linear-gradient(145deg,#050505,#111,#050505);color:var(--white);font-family:Arial,Helvetica,sans-serif}
    main{width:min(100%,620px);padding:clamp(30px,7vw,56px);border:1px solid rgba(212,175,55,.28);border-radius:34px;background:rgba(12,12,12,.92);box-shadow:0 35px 100px rgba(0,0,0,.65);text-align:center}
    img{width:104px;height:104px;border-radius:24px;box-shadow:0 18px 55px rgba(0,0,0,.48)}
    .eyebrow{margin-top:25px;color:var(--gold);font-size:.68rem;font-weight:900;letter-spacing:2.4px;text-transform:uppercase}
    h1{margin:13px 0 0;color:var(--gold2);font-family:Georgia,serif;font-size:clamp(3rem,12vw,5.6rem);line-height:.86;letter-spacing:-.05em;text-transform:uppercase}
    p{max-width:490px;margin:23px auto 0;color:var(--muted);font-size:.92rem;line-height:1.75}
    .privacy{font-size:.74rem;color:#7f7b72}
    .actions{margin-top:28px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    button,a{min-height:48px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font:700 .7rem Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;text-decoration:none;cursor:pointer}
    button{border:0;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#050505}
    a{border:1px solid rgba(255,255,255,.1);color:var(--white)}
  </style>
</head>
<body>
  <main>
    <img src="/images/applogo192.png?v=20260827.2" alt="JT Performance Hub">
    <div class="eyebrow">Secure Offline Mode</div>
    <h1>You’re Offline.</h1>
    <p>Reconnect to load your live Performance Hub, coaching sessions and latest player information.</p>
    <p class="privacy">Private player records and Supabase responses are intentionally not stored in the offline cache.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Try Again</button>
      <a href="/performance-hub-login.html">Player Login</a>
    </div>
  </main>
</body>
</html>
